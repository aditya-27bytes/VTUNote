<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Field Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(180deg, #f7f7fb 0%, #f8f9ff 60%, #ffffff 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #4f46e5;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            background: #ffffff;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
            margin-bottom: 12px;
            cursor: text;
            pointer-events: auto;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .option-group {
            border: 1px dashed #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        
        .option-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .option-label {
            font-weight: bold;
            min-width: 25px;
            color: #374151;
        }
        
        .test-result {
            padding: 10px;
            margin-top: 20px;
            border-radius: 6px;
            background: #f0fdf4;
            border: 1px solid #dcfce7;
            color: #166534;
        }
        
        button {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 15px;
        }
        
        button:hover {
            filter: brightness(0.95);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(99,102,241,0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 MCQ Input Field Test</h1>
        
        <p><strong>Test Instructions:</strong> Try typing in all the input fields below to verify they accept text input properly.</p>
        
        <div class="option-group">
            <h3>Question 1</h3>
            <input type="text" class="form-input" placeholder="Question 1" />
            
            <div class="option-row">
                <span class="option-label">A.</span>
                <input type="text" class="form-input" placeholder="Option A" style="margin-bottom: 0;" />
                <input type="radio" name="q1" />
            </div>
            
            <div class="option-row">
                <span class="option-label">B.</span>
                <input type="text" class="form-input" placeholder="Option B" style="margin-bottom: 0;" />
                <input type="radio" name="q1" />
            </div>
            
            <div class="option-row">
                <span class="option-label">C.</span>
                <input type="text" class="form-input" placeholder="Option C" style="margin-bottom: 0;" />
                <input type="radio" name="q1" />
            </div>
            
            <div class="option-row">
                <span class="option-label">D.</span>
                <input type="text" class="form-input" placeholder="Option D" style="margin-bottom: 0;" />
                <input type="radio" name="q1" />
            </div>
            
            <input type="text" class="form-input" placeholder="Optional explanation for the answer" />
        </div>
        
        <button onclick="testInputs()">Test All Inputs</button>
        
        <div id="result" class="test-result" style="display: none;">
            <strong>✅ Test Result:</strong> <span id="result-text"></span>
        </div>
    </div>

    <script>
        function testInputs() {
            const inputs = document.querySelectorAll('input[type="text"]');
            let allWorking = true;
            let results = [];
            
            inputs.forEach((input, index) => {
                // Test if we can set and get value
                const testValue = `Test ${index + 1}`;
                input.value = testValue;
                
                if (input.value === testValue) {
                    results.push(`Input ${index + 1}: ✅ Working`);
                } else {
                    results.push(`Input ${index + 1}: ❌ Not working`);
                    allWorking = false;
                }
                
                // Clear the test value
                input.value = '';
            });
            
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('result-text');
            
            if (allWorking) {
                resultText.innerHTML = 'All input fields are working correctly! You can type in all the text boxes.';
                resultDiv.style.background = '#f0fdf4';
                resultDiv.style.borderColor = '#dcfce7';
                resultDiv.style.color = '#166534';
            } else {
                resultText.innerHTML = 'Some input fields are not working properly. Check the browser console for details.';
                resultDiv.style.background = '#fef2f2';
                resultDiv.style.borderColor = '#fee2e2';
                resultDiv.style.color = '#991b1b';
            }
            
            resultDiv.style.display = 'block';
            console.log('Input Field Test Results:', results);
        }
        
        // Add event listeners to test typing
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input[type="text"]');
            inputs.forEach((input, index) => {
                input.addEventListener('input', function(e) {
                    console.log(`Input ${index + 1} changed:`, e.target.value);
                });
                
                input.addEventListener('focus', function() {
                    console.log(`Input ${index + 1} focused`);
                });
                
                input.addEventListener('blur', function() {
                    console.log(`Input ${index + 1} blurred`);
                });
            });
        });
    </script>
</body>
</html>
